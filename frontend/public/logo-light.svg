<?xml version="1.0" encoding="UTF-8"?>
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Expense Tracker logo - light mode">
  <!-- transparent background -->
  <defs>
    <!-- color palette -->
    <style>
      .navy { fill: #001f3f; }
      .teal { fill: #007b7f; }
      .emerald { fill: #2ecc71; }
      .gold { fill: #ffb300; }
      .charcoal { fill: #333333; }
      .charcoal-stroke { stroke: #333333; stroke-width: 2; }
    </style>
  </defs>
  <!-- three bars chart -->
  <rect x="22" y="50" width="12" height="30" class="navy" rx="2" ry="2" />
  <rect x="44" y="40" width="12" height="40" class="teal" rx="2" ry="2" />
  <rect x="66" y="30" width="12" height="50" class="emerald" rx="2" ry="2" />
  <!-- upward arrow overlay -->
  <path d="M20,55 L40,45 L60,35 L80,25" class="gold charcoal-stroke" fill="none" />
  <polygon points="79,26 83,22 87,26 83,18" class="gold charcoal-stroke" />
</svg>